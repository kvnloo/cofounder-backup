version: '3.8'

services:
  dashboard:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.dashboard
    ports:
      - "${PORT:-4200}:4200"
    volumes:
      - ../../cofounder/dashboard:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COFOUNDER_API_KEY=${COFOUNDER_API_KEY}
      - API_URL=${API_URL:-http://localhost:3000}
      - PORT=${PORT:-4200}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:4200}
      - OPENAI_API_URL=http://openai-proxy:3001/v1
      - OLLAMA_API_URL=http://ollama:11434
    command: npm run start
    depends_on:
      - api
      - openai-proxy
      - ollama

  api:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.api
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ../../cofounder/api:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COFOUNDER_API_KEY=${COFOUNDER_API_KEY}
      - API_PORT=${API_PORT:-3000}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-cofounder_dev}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:4200}
      - OPENAI_API_URL=http://openai-proxy:3001/v1
      - OLLAMA_API_URL=http://ollama:11434
    command: npm run start
    depends_on:
      - postgres
      - redis
      - ollama

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    environment:
      - OLLAMA_MODELS=qwen2.5:0.5b,all-minilm
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - OLLAMA_ARCH=${OLLAMA_ARCH:-amd64}
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=http://localhost:4200
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  boilerplate:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.boilerplate
    volumes:
      - ../../cofounder/boilerplate:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - OLLAMA_API_URL=http://ollama:11434
    command: npm run start
    depends_on:
      - api
      - ollama

  vite:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.vite
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ../../apps:/app/apps
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_PORT=${VITE_PORT:-5173}
      - OLLAMA_API_URL=http://ollama:11434
    command: npm run dev
    depends_on:
      - api
      - ollama

  openai-proxy:
    build:
      context: ./services/openai-proxy
      dockerfile: Dockerfile
    ports:
      - "${OPENAI_PROXY_PORT:-3001}:3001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_ORG_ID=${OPENAI_ORG_ID}
      - OLLAMA_API_URL=http://ollama:11434
      - OPENAI_PROXY_PORT=${OPENAI_PROXY_PORT:-3001}
    depends_on:
      - ollama

  postgres:
    image: postgres:16-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-cofounder_dev}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  ollama_data:
